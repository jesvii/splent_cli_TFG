name: Codacy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CLI quality checks
    runs-on: ubuntu-latest
    env:
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Codacy Analysis CLI
        if: github.event_name == 'push' && env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-analysis-cli-action@master
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          upload: true
          max-allowed-issues: 0

      - name: Skip Codacy Analysis CLI
        if: github.event_name == 'push' && env.CODACY_PROJECT_TOKEN == ''
        run: echo "CODACY_PROJECT_TOKEN secret is not configured; skipping Codacy analysis upload."
