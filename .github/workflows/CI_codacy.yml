name: Codacy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: CLI quality checks
    runs-on: ubuntu-latest
    env:
      CODACY_TOKEN: ${{ secrets.CODACY_TOKEN }}
      CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN || secrets.CODACY_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SPLENT workspace layout
        run: |
          sudo mkdir -p /workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace/splent_cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install package and test dependencies
        working-directory: /workspace/splent_cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install splent-framework
          python -m pip install -e ".[dev]"

      - name: Run tests with coverage
        working-directory: /workspace/splent_cli
        env:
          WORKING_DIR: /workspace
          SPLENT_APP: test_app
          SPLENT_ENV: dev
          COVERAGE_FILE: /tmp/splent_cli.coverage
        run: |
          docker info
          coverage run --source=src/splent_cli -m pytest tests/unit
          coverage xml

      - name: Run Codacy Analysis CLI
        if: github.event_name == 'push' && env.CODACY_TOKEN != ''
        continue-on-error: true
        uses: codacy/codacy-analysis-cli-action@master
        with:
          project-token: ${{ env.CODACY_TOKEN }}
          upload: true
          max-allowed-issues: 0

      - name: Skip Codacy Analysis CLI
        if: github.event_name == 'push' && env.CODACY_TOKEN == ''
        run: echo "CODACY_TOKEN secret is not configured; skipping Codacy analysis upload."

      - name: Upload coverage to Codacy
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CODACY_PROJECT_TOKEN != ''
        uses: codacy/codacy-coverage-reporter-action@v1
        with:
          project-token: ${{ env.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

      - name: Skip coverage upload
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && env.CODACY_PROJECT_TOKEN == ''
        run: echo "Codacy project token is not configured; skipping coverage upload."
