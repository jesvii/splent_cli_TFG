name: Codacy CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: CLI quality checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare SPLENT workspace layout
        run: |
          sudo mkdir -p /workspace
          sudo ln -sfn "$GITHUB_WORKSPACE" /workspace/splent_cli

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        working-directory: /workspace/splent_cli
        run: |
          python -m pip install --upgrade pip
          python -m pip install splent-framework
          python -m pip install -e ".[dev]"
          python -m pip install pip-audit codacy-coverage

      - name: Check for outdated dependencies
        working-directory: /workspace/splent_cli
        run: pip list --outdated

      - name: Security audit with pip-audit
        working-directory: /workspace/splent_cli
        run: pip-audit || true

      - name: Run tests
        working-directory: /workspace/splent_cli
        env:
          WORKING_DIR: /workspace
          SPLENT_APP: test_app
          SPLENT_ENV: dev
        run: |
          docker info
          python -m pytest tests/unit

      - name: Upload coverage to Codacy
        if: github.event_name == 'push'
        working-directory: /workspace/splent_cli
        run: |
          coverage run --source=src -m pytest tests/unit
          coverage xml
          python-codacy-coverage -r coverage.xml
        env:
          WORKING_DIR: /workspace
          SPLENT_APP: test_app
          SPLENT_ENV: dev
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN || secrets.CODACY_TOKEN }}

      - name: Run Codacy Analysis CLI
        if: github.event_name == 'push'
        uses: codacy/codacy-analysis-cli-action@master
        with:
          directory: ${{ github.workspace }}/src
          output: results.sarif
          format: sarif
          gh-code-scanning-compat: true
          max-allowed-issues: 2147483647

      - name: Upload SARIF results
        if: github.event_name == 'push'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
